[versions]
kotlin = "1.3.41"
androidx_appcompat = "1.1.0"
androidx_core = "1.1.0"
androidx_constraint_layout = "1.1.3"
androidx_lifecycle = "2.2.0"
androidx_recycler_view = "1.1.0"
androidx_navigation = "2.2.0"
okhttp_logging_interceptor = "4.3.1"
retrofit = "2.7.1"
timber = "4.7.1"
room = "2.2.3"
koin = "2.0.1"
rx_core = "2.2.17"
rx_android = "2.1.1"
junit = "4.13"
test = "1.2.0"
test_ext = "1.1.1"
espresso = "3.2.0"
lottie = "3.3.1"
picasso = "2.71828"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlin" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx_appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx_core" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx_constraint_layout" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "androidx_lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx_lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx_recycler_view" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx_navigation" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx_navigation" }
retrofit-runtime = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
retrofit-rx = { module = "com.squareup.retrofit2:adapter-rxjava2", version.ref = "retrofit" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
koin-core = { module = "org.koin:koin-android", version.ref = "koin" }
koin-scope = { module = "org.koin:koin-androidx-scope", version.ref = "koin" }
koin-viewmodel = { module = "org.koin:koin-androidx-viewmodel", version.ref = "koin" }
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rx_core" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rx_android" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp_logging_interceptor" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picasso" }
testing-junit = { module = "junit:junit", version.ref = "junit" }
testing-core = { module = "androidx.test:core", version.ref = "test" }
testing-rules = { module = "androidx.test:rules", version.ref = "test" }
testing-runner = { module = "androidx.test:runner", version.ref = "test" }
testing-ext = { module = "androidx.test.ext:junit", version.ref = "test_ext" }
testing-koin = { module = "org.koin:koin-test", version.ref = "koin" }
testing-espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
